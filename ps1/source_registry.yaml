adapters:
  ds2_hebbars_web:
    adapter: WebScraperAdapter
    source_id: ds2_hebbars_web
    source_type: web
    version: "1.0"
    config:
      url_file: "data/raw/recipe_urls.txt"
      timeout: 15

  ds3_youtube_recipe:
    adapter: YouTubeRecipeAdapter
    source_id: ds3_youtube_recipe
    source_type: youtube
    version: "1.0"
    config:
      urls:
        - "https://www.youtube.com/watch?v=elN-VTOFBDw"
      transcript_languages:
        - "en"